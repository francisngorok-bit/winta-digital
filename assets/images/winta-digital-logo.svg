<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none" width="100%" height="100%">
  <defs>
    <!-- Vibrant 3D Blue Ribbon Gradients -->
    <linearGradient id="wd-blue-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="40%" stop-color="#0185F3" />
      <stop offset="100%" stop-color="#012869" />
    </linearGradient>

    <linearGradient id="wd-blue-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0185F3" />
      <stop offset="100%" stop-color="#0A1E4A" />
    </linearGradient>

    <linearGradient id="wd-blue-grad-3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#012869" />
      <stop offset="60%" stop-color="#0185F3" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <filter id="wd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- WD Monogram Mark (Clean Vector Ribbon) -->
  <g transform="translate(10, 20)">
    <!-- Background Glow -->
    <path d="M 60 140 L 120 40 L 180 120 L 230 45 L 300 45 C 380 45 420 90 420 135 C 420 180 370 215 280 215 L 180 215 C 130 215 80 180 60 140 Z" 
          fill="#0185F3" opacity="0.2" filter="url(#wd-glow)" />

    <!-- Left Wing of W -->
    <path d="M 40 145 L 115 25 C 122 15 136 15 143 25 L 195 110 L 160 160 L 125 105 L 75 185 C 65 200 42 195 35 178 C 30 165 33 153 40 145 Z" 
          fill="url(#wd-blue-grad-1)" />

    <!-- Center Cross Ribbon to D -->
    <path d="M 125 25 L 230 170 C 242 188 265 195 288 195 L 300 195 C 355 195 385 165 385 130 C 385 95 355 65 300 65 L 260 65 L 260 25 L 300 25 C 385 25 430 75 430 130 C 430 185 380 235 295 235 L 235 235 C 195 235 160 215 140 180 L 105 130 L 125 25 Z" 
          fill="url(#wd-blue-grad-2)" />

    <!-- Inner Core & Accent Geometry -->
    <rect x="250" y="85" width="40" height="55" rx="6" fill="#0185F3" />
    <path d="M 195 110 L 245 35 C 252 25 266 25 273 35 L 305 85 L 275 85 L 260 60 L 220 120 Z" 
          fill="url(#wd-blue-grad-3)" />
  </g>

  <!-- Typography Block -->
  <g transform="translate(470, 40)">
    <!-- WINTA DIGITAL -->
    <text x="0" y="75" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="52" letter-spacing="3.5">
      WINTA DIGITAL
    </text>

    <!-- Tagline: Audio, Visual, Digital Training and Marketing -->
    <text x="2" y="125" fill="#0185F3" font-family="'Inter', sans-serif" font-weight="700" font-size="16.5" letter-spacing="1.2">
      Audio, Visual, Digital Training and Marketing
    </text>
  </g>
</svg>
